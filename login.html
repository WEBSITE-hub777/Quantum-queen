<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Queen AI — Login</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 20% 20%,rgba(139,92,246,.24),transparent 32%),
        radial-gradient(circle at 80% 80%,rgba(168,85,247,.18),transparent 32%),
        #08070d;
      color:#fff;
    }
    .login-card{
      width:min(430px,100%);
      padding:34px;
      border:1px solid rgba(255,255,255,.12);
      border-radius:28px;
      background:rgba(20,16,29,.92);
      box-shadow:0 30px 90px rgba(0,0,0,.45);
      backdrop-filter:blur(18px);
    }
    .logo{
      width:70px;height:70px;
      margin:0 auto 18px;
      border-radius:22px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,#7c3aed,#a855f7);
      box-shadow:0 14px 35px rgba(124,58,237,.35);
      font-size:30px;
      font-weight:900;
    }
    h1{text-align:center;font-size:27px;letter-spacing:-.5px}
    .subtitle{
      text-align:center;
      color:#aaa2b8;
      font-size:14px;
      margin:8px 0 28px;
    }
    label{
      display:block;
      margin:0 0 8px;
      color:#ddd7e5;
      font-size:14px;
      font-weight:600;
    }
    input{
      width:100%;
      height:50px;
      padding:0 15px;
      margin-bottom:18px;
      border:1px solid #393241;
      border-radius:14px;
      outline:none;
      background:#121019;
      color:#fff;
      font-size:15px;
      transition:.2s;
    }
    input::placeholder{color:#746d7e}
    input:focus{
      border-color:#8b5cf6;
      box-shadow:0 0 0 4px rgba(139,92,246,.13);
    }
    .error{
      min-height:21px;
      margin:-6px 0 10px;
      color:#ff6b81;
      font-size:13px;
      text-align:center;
    }
    button{
      width:100%;
      height:50px;
      border:0;
      border-radius:14px;
      background:linear-gradient(135deg,#7c3aed,#a855f7);
      color:#fff;
      font-size:15px;
      font-weight:800;
      cursor:pointer;
      box-shadow:0 12px 28px rgba(124,58,237,.28);
      transition:transform .18s,filter .18s;
    }
    button:hover{filter:brightness(1.08);transform:translateY(-1px)}
    button:active{transform:translateY(0)}
    .note{
      margin-top:18px;
      color:#756e80;
      text-align:center;
      font-size:11px;
    }
  </style>
</head>
<body>

  <main class="login-card">
    <div class="logo">Q</div>
    <h1>Quantum Queen AI</h1>
    <p class="subtitle">Enter your details to continue</p>

    <form id="loginForm" novalidate>
      <label for="name">Name</label>
      <input
        id="name"
        name="name"
        type="text"
        placeholder="Enter your name"
        autocomplete="name"
      >

      <label for="email">Email ID</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="Enter your email"
        autocomplete="email"
      >

      <div class="error" id="error" role="alert"></div>

      <button type="submit">Continue</button>
    </form>

    <p class="note">Your details are saved locally on this device.</p>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const nameInput = document.getElementById("name");
    const emailInput = document.getElementById("email");
    const error = document.getElementById("error");

    form.addEventListener("submit", function(event){
      event.preventDefault();

      const name = nameInput.value.trim();
      const email = emailInput.value.trim();

      if(!name){
        error.textContent = "Please fill the box.";
        nameInput.focus();
        return;
      }

      if(!email){
        error.textContent = "Please fill the box.";
        emailInput.focus();
        return;
      }

      if(!emailInput.checkValidity()){
        error.textContent = "Please enter a valid email ID.";
        emailInput.focus();
        return;
      }

      const user = {
        name: name,
        email: email
      };

      localStorage.setItem("quantum_queen_user", JSON.stringify(user));

      // Quantum Queen AI page will be created later with this filename.
      window.location.href = "index.html";
    });

    [nameInput, emailInput].forEach(function(input){
      input.addEventListener("input", function(){
        error.textContent = "";
      });
    });
  </script>

</body>
</html>
